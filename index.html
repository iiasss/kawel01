<!DOCTYPE html>
<html>
<head>
  <title>grats</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b8e6b8, #dff7df);
      color: #1f3d1f;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* MAIN CARD */
    .card {
      text-align: center;
      padding: 30px;
      background: rgba(255,255,255,0.55);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      z-index: 3;
      width: 320px;
      backdrop-filter: blur(5px);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #2f5e2f;
    }

    .sub {
      font-size: 14px;
      margin-top: 6px;
      color: #3b6b3b;
    }

    /* BUTTON */
    .meowth-btn {
      width: 170px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 18px;
      border: 2px solid #2f5e2f;
      padding: 8px;
      background: white;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
      animation: float 3s ease-in-out infinite;
    }

    .meowth-btn:active {
      transform: scale(0.93);
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .click-text {
      margin-top: 8px;
      font-weight: bold;
      font-size: 16px;
      color: #2f5e2f;
    }

    #message {
      display: none;
      margin-top: 15px;
      font-size: 18px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
    }

    /* EMOJIS */
    .emoji {
      position: absolute;
      font-size: 22px;
      animation: pop 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes pop {
      0% { transform: scale(0.3) translateY(0); opacity: 1; }
      100% { transform: scale(1.4) translateY(-120px); opacity: 0; }
    }

    /* BACKGROUND STICKERS */
    .sticker {
      position: absolute;
      width: 110px;
      opacity: 0.12;
      z-index: 1;
      pointer-events: none;
      animation: drift 6s ease-in-out infinite;
    }

    @keyframes drift {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .s1 { top: 10%; left: 5%; }
    .s2 { top: 15%; right: 8%; }
    .s3 { bottom: 10%; left: 10%; }
    .s4 { bottom: 12%; right: 10%; }

    /* BOTTOM GIF */
    #bottomGif {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      z-index: 2;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <!-- BACKGROUND STICKERS -->
  <img src="https://media.tenor.com/MvPZleT_pWcAAAAM/oshawott-pokemon.gif" class="sticker s1">
  <img src="https://media.tenor.com/zvHUFZ_IODgAAAAM/oshapip.gif" class="sticker s2">
  <img src="https://media.tenor.com/j55pHVgebMIAAAAM/meowth-sleeping-on-wool.gif" class="sticker s3">
  <img src="https://media1.tenor.com/m/VDszZM1qdaYAAAAC/pokemon-team-rocket.gif" class="sticker s4">

  <div class="card">

    <h1>grats</h1>
    <div class="sub">click meowth for a surprise!</div>

    <img
      src="https://media1.tenor.com/m/pJo28GRZZPQAAAAC/meowth-pokemon.gif"
      class="meowth-btn"
      onclick="activate()"
    >

    <div class="click-text">click me</div>

    <div id="message">
      halfway done, woohoo!
    </div>

  </div>

  <!-- bottom gif -->
  <img id="bottomGif" src="https://media.tenor.com/pFrb9pSkn7EAAAAM/pokemon.gif">

<script>
function activate() {
  document.getElementById("message").style.display = "block";
  document.getElementById("bottomGif").style.display = "block";

  spawnCats();
  playCats();
}

/* 🐱 CAT EMOJI BURST */
function spawnCats() {
  const cats = ["🐱", "🐾", "😺", "😸", "😹"];

  for (let i = 0; i < 25; i++) {
    const el = document.createElement("div");
    el.className = "emoji";
    el.innerText = cats[Math.floor(Math.random() * cats.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.top = Math.random() * 70 + "vh";
    el.style.fontSize = (18 + Math.random() * 14) + "px";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 1200);
  }
}

/* 🐱 CAT SOUNDS */
function playCats() {
  const sounds = [
    "https://actions.google.com/sounds/v1/animals/cat_meow_1.ogg",
    "https://actions.google.com/sounds/v1/animals/cat_meow_2.ogg",
    "https://actions.google.com/sounds/v1/animals/cat_meow_3.ogg"
  ];

  for (let i = 0; i < 3; i++) {
    const audio = new Audio(sounds[Math.floor(Math.random() * sounds.length)]);
    audio.volume = 0.6;
    setTimeout(() => audio.play(), i * 200);
  }
}
</script>

</body>
</html>
