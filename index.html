<!DOCTYPE html>
<html>
<head>
  <title>congratulations</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b8e6b8, #dff7df);
      height: 100vh;
    }

    /* START SCREEN */
    .start-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.8s ease;
    }

    .card {
      text-align: center;
      padding: 30px;
      background: rgba(255,255,255,0.55);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 340px;
      backdrop-filter: blur(5px);
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #2f5e2f;
    }

    .sub {
      font-size: 14px;
      margin-top: 6px;
      color: #3b6b3b;
    }

    .meowth-btn {
      width: 170px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 18px;
      border: 2px solid #2f5e2f;
      padding: 8px;
      background: white;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    /* FADE OUT START SCREEN */
    .fade-out {
      transform: scale(1.1);
      opacity: 0;
      pointer-events: none;
    }

    /* VICTORY SCREEN */
    .victory {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: radial-gradient(circle, #ffffff, #b8e6b8);
      z-index: 10;
      animation: victoryFade 1s ease forwards;
    }

    @keyframes victoryFade {
      from { opacity: 0; transform: scale(1.2); }
      to { opacity: 1; transform: scale(1); }
    }

    .victory h1 {
      font-size: 40px;
      color: #2f5e2f;
      margin-bottom: 10px;
      animation: pop 0.6s ease;
    }

    .victory p {
      font-size: 18px;
      color: #2b4d2b;
      background: rgba(255,255,255,0.6);
      padding: 10px 15px;
      border-radius: 12px;
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* EMOJIS */
    .emoji {
      position: absolute;
      font-size: 22px;
      animation: pop 1.2s ease-out forwards;
      pointer-events: none;
    }

    /* STICKERS */
    .sticker {
      position: absolute;
      width: 110px;
      opacity: 1;
      pointer-events: none;
      animation: float 4s ease-in-out infinite;
    }

    .s1 { top: 10%; left: 5%; }
    .s2 { top: 12%; right: 6%; }
    .s3 { bottom: 10%; left: 10%; }
    .s4 { bottom: 12%; right: 8%; }

  </style>
</head>

<body>

<!-- START SCREEN -->
<div class="start-screen" id="startScreen">

  <div class="card">
    <h1>congratulations</h1>
    <div class="sub">click meowth for a surprise!</div>

    <img
      src="https://media1.tenor.com/m/pJo28GRZZPQAAAAC/meowth-pokemon.gif"
      class="meowth-btn"
      onclick="activate()"
    >

    <div class="sub">click me</div>
  </div>

</div>

<!-- VICTORY SCREEN -->
<div class="victory" id="victoryScreen">

  <h1>🎉 Congratulations!</h1>
  <p>halfway done, woohoo! 🐱</p>

  <!-- GIFS APPEAR HERE -->
  <img src="https://media.tenor.com/MvPZleT_pWcAAAAM/oshawott-pokemon.gif" class="sticker s1">
  <img src="https://media.tenor.com/zvHUFZ_IODgAAAAM/oshapip.gif" class="sticker s2">
  <img src="https://media.tenor.com/j55pHVgebMIAAAAM/meowth-sleeping-on-wool.gif" class="sticker s3">
  <img src="https://media1.tenor.com/m/VDszZM1qdaYAAAAC/pokemon-team-rocket.gif" class="sticker s4">

</div>

<script>
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;

  const audio = new Audio("https://actions.google.com/sounds/v1/animals/cat_meow_1.ogg");
  audio.volume = 0.01;
  audio.play().catch(() => {});
  audioUnlocked = true;
}

function playCats() {
  unlockAudio();

  const sounds = [
    "https://actions.google.com/sounds/v1/animals/cat_meow_1.ogg",
    "https://actions.google.com/sounds/v1/animals/cat_meow_2.ogg",
    "https://actions.google.com/sounds/v1/animals/cat_meow_3.ogg"
  ];

  for (let i = 0; i < 3; i++) {
    const audio = new Audio(sounds[Math.floor(Math.random() * sounds.length)]);
    audio.volume = 0.8;
    audio.play().catch(() => {});
  }
}

/* EMOJIS */
function spawnCats() {
  const cats = ["🐱", "🐾", "😺", "😸", "😹"];

  for (let i = 0; i < 30; i++) {
    const el = document.createElement("div");
    el.className = "emoji";
    el.innerText = cats[Math.floor(Math.random() * cats.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.top = Math.random() * 80 + "vh";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}

/* 🔥 MAIN TRANSITION */
function activate() {
  playCats();
  spawnCats();

  const start = document.getElementById("startScreen");
  const victory = document.getElementById("victoryScreen");

  start.classList.add("fade-out");

  setTimeout(() => {
    start.style.display = "none";
    victory.style.display = "flex";
  }, 800);
}
</script>

</body>
</html>
