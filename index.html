<!DOCTYPE html>
<html>
<head>
  <title>grats</title>

  <style>
    body {
      background: linear-gradient(135deg, #b8e6b8, #dff7df);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #1f3d1f;
    }

    h1 {
      margin-top: 40px;
      font-size: 28px;
      color: #2f5e2f;
      position: relative;
      z-index: 2;
    }

    .sub {
      font-size: 16px;
      color: #3b6b3b;
      margin-top: -8px;
      position: relative;
      z-index: 2;
    }

    /* 🐱 BACKGROUND CATS */
    .bg-cat {
      position: absolute;
      width: 90px;
      opacity: 0.12;
      z-index: 0;
      pointer-events: none;
    }

    .c1 { top: 12%; left: 6%; }
    .c2 { top: 38%; right: 8%; }
    .c3 { bottom: 15%; left: 40%; }

    /* BUTTON */
    .meowth-btn {
      width: 190px;
      margin-top: 50px;
      cursor: pointer;

      border-radius: 20px;
      border: 2px solid #2f5e2f;
      background: rgba(255,255,255,0.6);
      padding: 10px;

      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
      animation: float 3s ease-in-out infinite;

      position: relative;
      z-index: 2;
    }

    .meowth-btn:active {
      transform: scale(0.92);
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .click-text {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #2f5e2f;
      position: relative;
      z-index: 2;
    }

    #message {
      display: none;
      margin-top: 20px;
      font-size: 22px;
      background: rgba(255,255,255,0.5);
      padding: 15px;
      border-radius: 14px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      animation: pop 0.4s ease;

      position: relative;
      z-index: 2;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* FIREWORKS */
    .firework {
      position: absolute;
      font-size: 22px;
      animation: explode 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes explode {
      0% { transform: scale(0.3) translateY(0); opacity: 1; }
      100% { transform: scale(1.5) translateY(-120px); opacity: 0; }
    }

    /* BOTTOM GIF */
    #bottomGif {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- BACKGROUND CATS -->
  <img src="https://media.tenor.com/0GfKk2l6QJQAAAAi/cat.gif" class="bg-cat c1">
  <img src="https://media.tenor.com/2r9ZpQ7kQ3kAAAAi/cat.gif" class="bg-cat c2">
  <img src="https://media.tenor.com/7xgQwq1m9QIAAAAi/cat.gif" class="bg-cat c3">

  <h1>grats</h1>
  <div class="sub">click meowth for a surprise!</div>

  <img
    src="https://media1.tenor.com/m/pJo28GRZZPQAAAAC/meowth-pokemon.gif"
    class="meowth-btn"
    onclick="activate()"
  >

  <div class="click-text">click me</div>

  <div id="message">
    Meowth approved.
  </div>

  <!-- bottom gif -->
  <img
    id="bottomGif"
    src="https://media.tenor.com/pFrb9pSkn7EAAAAM/pokemon.gif"
  >

<script>
  function activate() {
    document.getElementById("message").style.display = "block";
    document.getElementById("bottomGif").style.display = "block";

    fireworkBurst();
    fireSound();
  }

  function fireworkBurst() {
    const emojis = ["🎆", "🎇", "✨", "💥"];

    for (let i = 0; i < 25; i++) {
      const el = document.createElement("div");
      el.className = "firework";
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      el.style.left = Math.random() * 100 + "vw";
      el.style.top = (50 + Math.random() * 30) + "vh";
      el.style.fontSize = (18 + Math.random() * 12) + "px";

      document.body.appendChild(el);

      setTimeout(() => el.remove(), 1200);
    }
  }

  function fireSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    for (let i = 0; i < 10; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "square";
      osc.frequency.value = 80 + Math.random() * 600;

      gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + i * 0.05 + 0.25
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + i * 0.03);
      osc.stop(ctx.currentTime + i * 0.2);
    }
  }
</script>

</body>
</html>
</body>
</html>
