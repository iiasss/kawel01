<!DOCTYPE html>
<html>
<head>
  <title>acetomeowth</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #b8e6b8, #dff7df);
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      text-align: center;
      padding: 30px;
      background: rgba(255,255,255,0.55);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 340px;
      position: relative;
      z-index: 3;
      backdrop-filter: blur(5px);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #2f5e2f;
    }

    .sub {
      font-size: 14px;
      margin-top: 6px;
      color: #3b6b3b;
    }

    .meowth-btn {
      width: 170px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 18px;
      border: 2px solid #2f5e2f;
      padding: 8px;
      background: white;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    #message {
      display: none;
      margin-top: 15px;
      font-size: 18px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
    }

    /* EMOJIS */
    .emoji {
      position: absolute;
      font-size: 22px;
      animation: pop 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.4) translateY(-120px); opacity: 0; }
    }

    /* STICKERS (hidden until click) */
    .sticker {
      position: absolute;
      width: 110px;
      display: none;
      z-index: 1;
      pointer-events: none;
    }

    .s1 { top: 10%; left: 5%; }
    .s2 { top: 12%; right: 6%; }
    .s3 { bottom: 10%; left: 10%; }
    .s4 { bottom: 12%; right: 8%; }
    .s5 { top: 5%; left: 45%; }
    .s6 { top: 60%; left: 5%; }
    .s7 { top: 45%; right: 15%; }

    #bottomGif {
      display: none;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      z-index: 2;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>congratulations</h1>
    <div class="sub">click meowth for a surprise!</div>

    <!-- MEOWTH -->
    <img
      src="https://media1.tenor.com/m/pJo28GRZZPQAAAAC/meowth-pokemon.gif"
      class="meowth-btn"
      onclick="activate()"
      onmouseenter="playMeowTone()"
    >

    <div id="message">
      congratulations, meowth! halfway done, woohoo! headpats go brrt brrt when i see you. #chokoluckalltheway
    </div>

  </div>

  <!-- GIFS -->
  <img src="https://media.tenor.com/MvPZleT_pWcAAAAM/oshawott-pokemon.gif" class="sticker s1">
  <img src="https://media.tenor.com/zvHUFZ_IODgAAAAM/oshapip.gif" class="sticker s2">
  <img src="https://media.tenor.com/j55pHVgebMIAAAAM/meowth-sleeping-on-wool.gif" class="sticker s3">
  <img src="https://media1.tenor.com/m/VDszZM1qdaYAAAAC/pokemon-team-rocket.gif" class="sticker s4">
  <img src="https://media.tenor.com/GPgydYlGEKgAAAAM/meowth-team-rocket.gif" class="sticker s5">
  <img src="https://media1.tenor.com/m/9ualI9AJSSsAAAAC/meowth-pokemon.gif" class="sticker s6">
  <img src="https://media.tenor.com/jG1w4gTuVz4AAAAM/pokemon-meowth.gif" class="sticker s7">

  <img id="bottomGif" src="https://media.tenor.com/pFrb9pSkn7EAAAAM/pokemon.gif">

<script>

/* 🔊 AUDIO ENGINE (NO FILES — 100% WORKING) */
let audioCtx;

function unlockAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  gain.gain.value = 0.001;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

/* 🐱 HOVER MEOW */
function playMeowTone() {
  unlockAudio();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

/* 🎉 CLICK ACTION */
function activate() {
  document.getElementById("message").style.display = "block";
  document.getElementById("bottomGif").style.display = "block";

  document.querySelectorAll(".sticker").forEach(el => {
    el.style.display = "block";
  });

  spawnCats();
  playBurst();
}

/* 🔊 CLICK BURST */
function playBurst() {
  for (let i = 0; i < 5; i++) {
    setTimeout(playMeowTone, i * 120);
  }
}

/* 🐱 EMOJIS */
function spawnCats() {
  const cats = ["🐱", "🐾", "😺", "😸", "😹"];

  for (let i = 0; i < 25; i++) {
    const el = document.createElement("div");
    el.className = "emoji";
    el.innerText = cats[Math.floor(Math.random() * cats.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.top = Math.random() * 70 + "vh";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

</script>

</body>
</html>
