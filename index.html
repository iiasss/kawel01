<!DOCTYPE html>
<html>
<head>
  <title>Meowth Button</title>

  <style>
    body {
      background: linear-gradient(135deg, #b8e6b8, #dff7df);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #1f3d1f;
    }

    h1 {
      margin-top: 40px;
      color: #2f5e2f;
      font-size: 28px;
    }

    .sub {
      font-size: 16px;
      color: #3b6b3b;
      margin-top: -8px;
    }

    /* button */
    .meowth-btn {
      width: 190px;
      margin-top: 50px;
      cursor: pointer;

      border-radius: 22px;
      border: 2px solid #2f5e2f;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px;

      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: float 3s ease-in-out infinite;
    }

    .meowth-btn:hover {
      transform: scale(1.05);
    }

    .meowth-btn:active {
      transform: scale(0.93);
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .click-text {
      margin-top: 10px;
      font-size: 18px;
      color: #2f5e2f;
      font-weight: bold;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 22px;
      color: #1f3d1f;
      padding: 16px;
      background: rgba(255,255,255,0.45);
      border-radius: 16px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* confetti */
    .confetti {
      position: absolute;
      font-size: 16px;
      animation: fall 1.8s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(180deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1>Meowth Button</h1>
  <div class="sub">click to continue</div>

  <img
    src="https://tenor.com/oikZL8pVvTc.gif"
    class="meowth-btn"
    onclick="activate()"
  >

  <div class="click-text">click me</div>

  <div id="message">
    congrats, Meowth is halfway through
  </div>

  <script>
    function activate() {
      document.getElementById("message").style.display = "block";
      playSound();
      confetti();
    }

    // simple click sound
    function playSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = 520;

      gain.gain.value = 0.08;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    }

    // light confetti
    function confetti() {
      const items = ["•", "✦", "·"];
      
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.innerText = items[Math.floor(Math.random() * items.length)];

        el.style.left = Math.random() * 100 + "vw";
        el.style.top = "-10px";

        document.body.appendChild(el);

        setTimeout(() => el.remove(), 1800);
      }
    }
  </script>

</body>
</html>
